<!DOCTYPE html>
<html>
<head>
<title>Spēle</title>
<style> 
  body {
  background-color: rgb(44, 43, 42);
  text-align: center;
  font-family: "Roboto Slab", "Lucida Console", "Courier New", monospace;
}
button {
  background-color: rgb(128, 105, 80);
  color: white;
  border-color:rgb(128, 105, 80);
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  cursor: pointer;
  transition: width 0.3s, height 0.3s, background-color 0.3s;
  border-radius: 5px;
}
.laukums {
 background-color: rgb(88, 80, 71);
  width: 400px;
  padding: 20px;
  margin: 20px auto;
  box-sizing: border-box;
  border-color:rgb(88, 80, 71);
  border-style: inset;
  border-radius: 5px;
}
</style>
</head>
<body>
    <div class="laukums">
      <div id="game" style="display:block;">
     <p>Pretiniekam atliek [<span style="color:rgb(255, 0, 0);font-weight:bold" id="enemyhp">0</span>] Dzīvības punkti</p>
      <p>Tavam varonim atliek [<span style="color:rgb(0, 255, 0);font-weight:bold" id="playerhp">0</span>] Dzīvības punkti</p>
        <p>Šobrīd ir [<span style="color:rgb(196, 196, 196);font-weight:bold" id="turn">0</span>] gājiens</p>
      <p style="font-size: 80%;">Pretinieks uzbrūk katru otro gājienu.</p>
<p><button type="button"; onclick="dealDamage(1);incrementTurn(1);checkifwin()">Uzbrukt par <span style="color:rgb(255, 0, 0);font-weight:bold" id="attack">0</span> ievainojuma punktiem</button></p>
<p><button type="button"; onclick="reduceDamage(1);incrementTurn(1);setenemydamage();checkifwin()">Aizsargāties par <span style="color:rgb(0, 162, 255);font-weight:bold" id="protection">0</span> aizsardzības punktiem</button></p>
<div id="pickupweapon" style="display:block;">
<p><button type="button"; onclick="setDamage(5);incrementTurn(1);checkifwin();hideweapon()"> Iegūt ieroci</button>
  </div>
  </div>
      <div id="win" style="display:none;">
<p style="color:rgb(4, 121, 218);font-weight:bold">Tu esi uzveicis savu pretinieku!</p>
      </div>
            <div id="dead" style="display:none;">
<p style="color:rgb(218, 4, 4);font-weight:bold">Tu esi miris...</p>
      </div>
          </div>
</body>
<script>
let damage = 1
 document.getElementById("attack").innerHTML = damage;
 let enemyhp = 10
 document.getElementById("enemyhp").innerHTML = enemyhp;
  let playerhp = 10
 document.getElementById("playerhp").innerHTML = playerhp;
   let damageprotection = 5
 document.getElementById("protection").innerHTML = damageprotection;
  let incomingreduction = 0
  let turn = 0
  document.getElementById("turn").innerHTML = turn;
  let enemydamage = 5
function setDamage(a) {
    damage = a;
    console.log(damage);
     document.getElementById("attack").innerHTML = damage;
}
function dealDamage(a) {
    enemyhp -= damage *= a;
    console.log(enemyhp);
     document.getElementById("enemyhp").innerHTML = enemyhp;
}
function reduceDamage(a) {
    incomingreduction = 5;
    console.log(incomingreduction);
}
function setenemydamage() {
    enemydamage -= incomingreduction;
    console.log(enemydamage);
}
function incrementTurn(a) {
    turn += a;
    console.log(turn);
      document.getElementById("turn").innerHTML = turn;
      if (turn % 2 === 0) {
console.log(`${turn} is an Even number`);
    playerhp = playerhp -= enemydamage;
     document.getElementById("playerhp").innerHTML = playerhp;
     incomingreduction = 0;
} else {
console.log(`${turn} is an Odd number`);
}
}
function checkifwin(a) {
  if (enemyhp < 1) {
    console.log("number 1 displayed");
    document.getElementById('game').style.display = "none";
   document.getElementById('win').style.display = "block";
  }
    else if (playerhp < 1) {
    console.log("playerdead");
    document.getElementById('game').style.display = "none";
   document.getElementById('dead').style.display = "block";
  }
    else {
    console.log("number 1 displayed");
    document.getElementById('game').style.display = "block";
        document.getElementById('win').style.display = "none";
  }
}
function hideweapon() {
 document.getElementById('pickupweapon').style.display = "none";
}
</script>
</html>
